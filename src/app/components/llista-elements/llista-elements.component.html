<div *ngIf="elementService.carregant()">
  <p>Carregant...</p>
</div>
<div *ngIf="elementService.error() as error">
  <p>{{ error }}</p>
  <button (click)="elementService.obtenirPopulars()">Reintentar</button>
</div>
<div *ngIf="!elementService.carregant() && !elementService.error()">
  <app-barra-cerca (cerca)="filtrarElementos($event)"></app-barra-cerca>
  <div class="grid">
    <app-targeta-element
      *ngFor="let el of elementService.elements(); trackBy: trackById"
      [elemento]="el">
    </app-targeta-element>
  </div>
</div>
