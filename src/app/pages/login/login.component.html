<form (ngSubmit)="onSubmit()">
  <input
    type="email"
    [(ngModel)]="email"
    name="email"
    placeholder="Email"
    required
  />

  <input
    type="password"
    [(ngModel)]="contrasenya"
    name="contrasenya"
    placeholder="Contrasenya"
    required
  />

  <button type="submit">Entrar</button>

  <p *ngIf="error" style="color: red">{{ error }}</p>
</form>
